<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Архив банок</title>
<style>
:root{--bg:#e8ecef;--card:#f7f9fa;--ink:#0f1b24;--mut:#5d6b76;--ac:#2457ff;--bd:#cfd6db}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#e9eef2;--mut:#8b99a4;--ac:#6f93ff;--bd:#2b3945}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,sans-serif}
header{padding:20px 16px 8px;display:flex;flex-wrap:wrap;gap:4px 24px;align-items:baseline}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat{color:var(--mut);font-size:14px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:12px 16px}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:9px 10px;min-width:0}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:4px 16px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.ph{aspect-ratio:2/3;background:var(--bd) center/cover no-repeat;position:relative}
.mark{position:absolute;right:6px;top:6px;background:var(--ac);color:#fff;font-size:12px;padding:2px 7px;border-radius:10px}
.card p{margin:0;padding:8px 10px;font-size:13px;line-height:1.35}
.card b{display:block;font-size:14px}
.more{display:block;margin:8px auto 32px}
.empty{padding:32px 16px;color:var(--mut)}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);padding:0;width:min(900px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:grid;grid-template-columns:1fr;gap:16px;padding:16px}
@media(min-width:720px){.dlg{grid-template-columns:3fr 2fr}}
.dlg .ph{aspect-ratio:auto;min-height:320px;background-size:contain;background-color:var(--bg)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0}
dt{color:var(--mut)}dd{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.close{float:right;margin:8px 8px 0 0}
</style>
</head>
<body>
<header>
  <h1>Архив банок</h1>
  <span class="stat">Банок в архиве: <b id="all">0</b></span>
  <span class="stat">В вашей коллекции: <b id="nOwned">0</b> · В желаемом: <b id="nWish">0</b></span>
</header>

<form class="filters" id="f" onsubmit="return false">
  <input id="q" type="search" placeholder="Поиск по названию">
  <select id="brand"><option value="">Все бренды</option></select>
  <select id="country"><option value="">Все страны</option></select>
  <input id="volume" type="number" placeholder="Объём, мл" min="0">
  <input id="year" type="number" placeholder="Год" min="1900" max="2100">
  <select id="shape">
    <option value="">Любая форма</option>
    <option value="slim">Вытянутая</option>
    <option value="wide">Пузатая</option>
  </select>
</form>

<div class="stat" style="padding:0 16px 8px">Найдено: <span id="found">0</span></div>
<main class="grid" id="grid"></main>
<button class="more" id="more" hidden>Показать ещё</button>

<dialog id="dlg"><button class="close" id="x">Закрыть</button><div id="dbody"></div></dialog>

<script>
const $ = s => document.querySelector(s);
const PAGE = 48;
const SHAPE = {slim: 'Вытянутая', wide: 'Пузатая'};
let st = {page: 0, total: 0, items: []};

// Тестовые данные: работают, пока не подключён бэкенд (/api/cans)
const DEMO = [
  {id:1,name:'Soda water — blueberry/pomegranate',brand:'AHA',country:'United States',volume:355,year:2020,shape:'wide',description:'Тестовая банка. Здесь будет ваше описание.',cover:null,photo:null},
  {id:2,name:'Soda water — citrus',brand:'AHA',country:'United States',volume:473,year:2020,shape:'slim',description:'Особенности банки, SKU и т. д.',cover:null,photo:null},
  {id:3,name:'Soda water — mango',brand:'AHA',country:'United States',volume:355,year:2022,shape:'wide',description:'',cover:null,photo:null},
  {id:4,name:'Ambasa melon flavored',brand:'Ambasa',country:'South Korea',volume:250,year:2019,shape:'wide',description:'',cover:null,photo:null}
];

// Желаемое и коллекция пока хранятся в браузере. Позже переедут в базу вместе со входом.
const get = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img = k => k ? `style="background-image:url('/img/${encodeURI(k)}')"` : '';

function counters() { $('#nOwned').textContent = get('owned').length; $('#nWish').textContent = get('wish').length; }

function demoQuery(p) {
  const q = (p.get('q') || '').toLowerCase();
  const items = DEMO.filter(c =>
    (!q || c.name.toLowerCase().includes(q)) &&
    (!p.get('brand') || c.brand === p.get('brand')) &&
    (!p.get('country') || c.country === p.get('country')) &&
    (!p.get('volume') || c.volume === +p.get('volume')) &&
    (!p.get('year') || c.year === +p.get('year')) &&
    (!p.get('shape') || c.shape === p.get('shape')));
  return {total: items.length, items};
}

async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

async function loadMeta() {
  let m;
  try { m = await api('/api/cans?meta=1'); }
  catch { m = {all: DEMO.length, brands: [...new Set(DEMO.map(c => c.brand))], countries: [...new Set(DEMO.map(c => c.country))]}; }
  $('#all').textContent = m.all;
  for (const [id, list] of [['brand', m.brands], ['country', m.countries]])
    $('#' + id).insertAdjacentHTML('beforeend', list.map(v => `<option>${esc(v)}</option>`).join(''));
}

function params() {
  const p = new URLSearchParams();
  for (const k of ['q', 'brand', 'country', 'volume', 'year', 'shape']) { const v = $('#' + k).value.trim(); if (v) p.set(k, v); }
  return p;
}

async function load(more) {
  if (!more) { st.page = 0; st.items = []; }
  const p = params();
  p.set('limit', PAGE); p.set('offset', st.page * PAGE);
  let d;
  try { d = await api('/api/cans?' + p); } catch { d = demoQuery(p); }
  st.items = st.items.concat(d.items); st.total = d.total; st.page++;
  render();
}

function render() {
  const owned = get('owned'), wish = get('wish');
  $('#found').textContent = st.total;
  $('#grid').innerHTML = st.items.length ? st.items.map(c => `
    <div class="card" tabindex="0" data-id="${c.id}">
      <div class="ph" ${img(c.cover)}>${owned.includes(c.id) ? '<span class="mark">есть</span>' : wish.includes(c.id) ? '<span class="mark">хочу</span>' : ''}</div>
      <p><b>${esc(c.brand)}</b>${esc(c.name)}<br>${esc(c.volume)} мл · ${esc(c.year)}</p>
    </div>`).join('') : '<div class="empty">Ничего не найдено. Измените фильтры.</div>';
  $('#more').hidden = st.items.length >= st.total;
}

function openCan(id) {
  const c = st.items.find(x => x.id === id); if (!c) return;
  const inList = k => get(k).includes(id);
  $('#dbody').innerHTML = `<div class="dlg">
    <div class="ph" ${img(c.photo || c.cover)}></div>
    <div>
      <h2 style="margin:0">${esc(c.brand)}</h2><div>${esc(c.name)}</div>
      <dl>
        <dt>Страна</dt><dd>${esc(c.country)}</dd>
        <dt>Объём</dt><dd>${esc(c.volume)} мл</dd>
        <dt>Год</dt><dd>${esc(c.year)}</dd>
        <dt>Форма</dt><dd>${esc(SHAPE[c.shape] || '—')}</dd>
      </dl>
      <p>${esc(c.description)}</p>
      <div class="row">
        <button data-k="owned" class="${inList('owned') ? 'on' : ''}">${inList('owned') ? 'Есть в коллекции' : 'Добавить в коллекцию'}</button>
        <button data-k="wish" class="${inList('wish') ? 'on' : ''}">${inList('wish') ? 'В желаемом' : 'Добавить в желаемое'}</button>
      </div>
    </div></div>`;
  $('#dbody').onclick = e => {
    const k = e.target.dataset.k; if (!k) return;
    const l = get(k), i = l.indexOf(id);
    i < 0 ? l.push(id) : l.splice(i, 1);
    put(k, l); counters(); render(); openCan(id);
  };
  if (!$('#dlg').open) $('#dlg').showModal();
}

$('#grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openCan(+c.dataset.id); });
$('#grid').addEventListener('keydown', e => { if (e.key === 'Enter') { const c = e.target.closest('.card'); if (c) openCan(+c.dataset.id); } });
$('#x').onclick = () => $('#dlg').close();
$('#more').onclick = () => load(true);
let t; $('#f').addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => load(false), 250); });

counters(); loadMeta(); load(false);
</script>
</body>
</html>
