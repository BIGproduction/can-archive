<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG_archive</title>
<style>
:root{--bg:#e8ecef;--card:#f7f9fa;--ink:#0f1b24;--mut:#5d6b76;--ac:#2457ff;--bd:#cfd6db}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#18222b;--ink:#e9eef2;--mut:#8b99a4;--ac:#6f93ff;--bd:#2b3945}}
:root[data-theme="dark"]{--bg:#10171d;--card:#18222b;--ink:#e9eef2;--mut:#8b99a4;--ac:#6f93ff;--bd:#2b3945}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,sans-serif}
header{padding:20px 16px 8px;display:flex;flex-wrap:wrap;gap:4px 24px;align-items:baseline}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat{color:var(--mut);font-size:14px}
.auth{margin-left:auto;align-self:flex-start;font-size:14px;color:var(--mut);display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.arow{display:flex;gap:8px;align-items:center}
.pubbar{padding:8px 16px;display:flex;gap:8px}
input,select,textarea,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:9px 10px;min-width:0}
button{cursor:pointer}
.primary{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;padding:10px 20px}
.sq{width:44px;height:44px;padding:0;display:grid;place-items:center}
#serBtn{background:var(--ac);border-color:var(--ac);color:#fff}
.sq svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.six{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:8px 16px}
.filters>*{width:100%}
#folders,#sFolders{row-gap:18px}
.tile{cursor:pointer}
.cap{text-align:center;margin-top:8px;font-size:14px}
.bbox{aspect-ratio:1;border:4px solid #0b0b0b;border-radius:18px;overflow:hidden;position:relative;background:var(--card)}
.mos{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr}
.mos i{background:var(--bd) center/cover no-repeat}
.badge{position:absolute;left:8px;top:8px;width:24%;aspect-ratio:1;display:block}
.fico{display:block;width:100%;height:auto}
.tile:hover .fico{filter:brightness(1.08)}
.tile:hover .bbox,.tile:focus-visible .bbox{border-color:var(--ac)}
.grid{gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;overflow:hidden;cursor:pointer}
.ph{aspect-ratio:2/3;background:var(--bd) center/cover no-repeat;position:relative}
.mark{position:absolute;right:6px;top:6px;background:var(--ac);color:#fff;font-size:12px;padding:2px 7px;border-radius:10px}
.card p{margin:0;padding:8px 10px;font-size:13px;line-height:1.35}
.card b{display:block;font-size:14px}
.bar{padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar h2{margin:0;font-size:22px}
.link{color:var(--ac);text-decoration:none;cursor:pointer}
.more{display:block;margin:8px auto 32px}
.empty{padding:24px 16px;color:var(--mut);grid-column:1/-1}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--ink);padding:0;width:min(900px,94vw);max-height:92vh}
dialog.sm{width:min(420px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:grid;grid-template-columns:1fr;gap:16px;padding:16px}
@media(min-width:720px){.dlg{grid-template-columns:3fr 2fr}}
.dlg .ph{aspect-ratio:auto;min-height:320px;background-size:contain;background-color:var(--bg)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0}
dt{color:var(--mut)}dd{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.close{float:right;margin:8px 8px 0 0}
form.stack{display:grid;gap:10px;padding:16px}
form.stack label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
.err{color:#d6336c;font-size:14px;min-height:20px}
.hint{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:8px}
[hidden]{display:none!important}
#sFolders{grid-template-columns:repeat(9,minmax(0,1fr))}
#sFolders .cap{font-size:13px}
@media(max-width:1100px){#sFolders{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:720px){#sFolders{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:720px){.six{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script>(function(){try{var x=localStorage.getItem("theme");if(x)document.documentElement.dataset.theme=x}catch(e){}})()</script>
</head>
<body>
<header>
  <h1>BIG_archive</h1>
  <span class="stat">Cans in archive: <b id="all">0</b></span>
  <span class="stat">In your collection: <b id="nOwned">0</b> · Wishlist: <b id="nWish">0</b></span>
  <span class="auth"><span class="arow"><span id="who"></span><button id="authBtn">Log in / Sign up</button></span><button class="sq" id="themeBtn" aria-label="Toggle light or dark theme"></button></span>
</header>

<div class="pubbar">
  <button class="sq" id="serBtn" title="Create flavor/series folder" aria-label="Create a flavor or series folder">
    <svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18z"/></svg>
  </button>
  <button class="primary" id="pubBtn">Publish cans</button>
</div>

<section id="home">
  <form class="six filters" id="f" onsubmit="return false">
    <input id="q" type="search" placeholder="Search by name">
    <select id="brand"><option value="">Brands</option></select>
    <select id="country"><option value="">Countries</option></select>
    <select id="volume"><option value="">Volume</option></select>
    <select id="year"><option value="">Year</option></select>
    <select id="shape">
      <option value="">Shape</option>
      <option value="slim">Slim</option>
      <option value="wide">Wide</option>
    </select>
  </form>
  <div class="six" id="folders"></div>
  <div id="results" hidden>
    <div class="bar"><a class="link" id="back">← All folders</a><span class="stat">Found: <span id="found">0</span></span></div>
    <div class="six grid" id="grid"></div>
    <button class="more" id="more" hidden>Show more</button>
  </div>
</section>

<section id="brandPage" hidden>
  <div class="bar"><a class="link" href="#">← All brands</a><h2 id="bTitle"></h2></div>
  <div class="six" id="sFolders"></div>
</section>

<section id="seriesPage" hidden>
  <div class="bar"><a class="link" id="sBack" href="#">← Back</a><h2 id="sTitle"></h2></div>
  <div class="six grid" id="sgrid"></div>
  <button class="more" id="smore" hidden>Show more</button>
</section>

<dialog id="dlg"><button class="close" data-close>Close</button><div id="dbody"></div></dialog>

<dialog id="authDlg" class="sm">
  <button class="close" data-close>Close</button>
  <form class="stack" id="authForm">
    <div class="tabs">
      <button type="button" id="tLogin" class="on">Log in</button>
      <button type="button" id="tReg">Sign up</button>
    </div>
    <label>Nickname<input id="aNick" autocomplete="username" required minlength="3" maxlength="20"></label>
    <label>Password<input id="aPass" type="password" autocomplete="current-password" required minlength="8"></label>
    <div class="err" id="aErr"></div>
    <button class="primary" id="aSubmit">Log in</button>
  </form>
</dialog>

<dialog id="serDlg" class="sm">
  <button class="close" data-close>Close</button>
  <form class="stack" id="serForm">
    <h2 style="margin:0">New flavor/series folder</h2>
    <label>Brand<select id="sBrand" required></select></label>
    <label>Folder name<input id="sName" required maxlength="60"></label>
    <div class="err" id="sErr"></div>
    <button class="primary">Create folder</button>
  </form>
</dialog>

<dialog id="pubDlg" class="sm">
  <button class="close" data-close>Close</button>
  <form class="stack" id="pubForm">
    <h2 style="margin:0">Publish a can</h2>
    <label>Brand<select name="brand" id="pBrand" required></select></label>
    <label id="pSerWrap" hidden>Flavor / series<select name="series_id" id="pSeries" required></select>
      <span class="hint" id="pHint"></span></label>
    <label>Name<input name="name" required maxlength="120"></label>
    <label>Country<input name="country" list="countries" required maxlength="60"></label>
    <label>Volume, ml<input name="volume" type="number" min="1" max="5000" required></label>
    <label>Year<input name="year" type="number" min="1900" max="2100" required></label>
    <label>Shape<select name="shape" required>
      <option value="slim">Slim</option><option value="wide">Wide</option></select></label>
    <label>Description<textarea name="description" rows="3" maxlength="2000"></textarea></label>
    <label>Photo (collage)<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label>
    <label>Catalog cover (optional)<input name="cover" type="file" accept="image/jpeg,image/png,image/webp"></label>
    <div class="err" id="pErr"></div>
    <button class="primary" id="pSubmit">Publish</button>
  </form>
</dialog>
<datalist id="countries"></datalist>

<script>
const $ = s => document.querySelector(s);
const PAGE = 48;
const SHAPE = {slim: 'Slim', wide: 'Wide'};
let me = null, meta = {brands: [], counts: {}, countries: [], volumes: [], years: [], all: 0};
let st = {page: 0, total: 0, items: []}, cur = null, mode = 'login', afterAuth = null;

const get = k => { try { return JSON.parse(localStorage.getItem(k) || '[]'); } catch { return []; } };
const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const img = k => k ? `style="background-image:url('/img/${encodeURI(k)}')"` : '';
const opts = (list, first, fmt = v => v) => (first ? `<option value="">${first}</option>` : '') + list.map(v => `<option value="${esc(v)}">${esc(fmt(v))}</option>`).join('');
const bg = k => `style="background-image:url('/img/${encodeURI(k)}')"`;
const brandTile = b => `<div class="tile" tabindex="0" data-b="${esc(b)}"><div class="bbox"><div class="mos">${(meta.covers?.[b] || []).map(k => `<i ${bg(k)}></i>`).join('')}</div><img class="badge" src="/folder-badge.png" alt=""></div><div class="cap">${esc(b)}</div></div>`;
const FICON = '<svg class="fico" viewBox="0 0 1335 1180" aria-hidden="true"><path d="M85 190Q85 50 190 50H440Q510 50 560 100L600 140Q640 180 700 180H1190Q1255 180 1255 245V420H85Z" fill="#348bee"/><rect x="163" y="228" width="1008" height="300" rx="45" fill="#f2f2f7"/><rect x="75" y="322" width="1185" height="765" rx="90" fill="#3d99fb"/></svg>';
const seriesTile = s => `<div class="tile" tabindex="0" data-s="${s.id}">${FICON}<div class="cap">${esc(s.name)}</div></div>`;
const coll = new Intl.Collator(['ru', 'en'], {numeric: true, sensitivity: 'base'});
const byName = a => [...a].sort((x, y) => coll.compare(x.name, y.name));
const counters = () => { $('#nOwned').textContent = get('owned').length; $('#nWish').textContent = get('wish').length; };

async function api(path, opt = {}) {
  const r = await fetch(path, {cache: 'no-store', ...opt});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Error ' + r.status);
  return j;
}

// ---------- списки для фильтров ----------
function fill(sel, html) { const v = $(sel).value; $(sel).innerHTML = html; $(sel).value = v; }
async function loadMeta() {
  try { meta = await api('/api/cans?meta=1'); } catch { return; }
  $('#all').textContent = meta.all;
  fill('#brand', opts(meta.brands, 'Brands'));
  fill('#country', opts(meta.countries, 'Countries'));
  fill('#volume', opts(meta.volumes, 'Volume', v => v + ' ml'));
  fill('#year', opts(meta.years, 'Year'));
  $('#countries').innerHTML = meta.countries.map(v => `<option value="${esc(v)}">`).join('');
  $('#pBrand').innerHTML = opts(meta.brands, 'Select a brand');
  $('#sBrand').innerHTML = opts(meta.brands, 'Select a brand');
  $('#folders').innerHTML = meta.brands.map(brandTile).join('');
}

// ---------- банки ----------
async function loadList(base, ui, more) {
  if (!more) { st.page = 0; st.items = []; }
  cur = {...ui, base};
  const p = new URLSearchParams(base); p.set('limit', PAGE); p.set('offset', st.page * PAGE);
  try {
    const d = await api('/api/cans?' + p);
    st.items = st.items.concat(d.items); st.total = d.total; st.page++;
  } catch (e) { $(ui.grid).innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  render();
}
function render() {
  const owned = get('owned'), wish = get('wish');
  if (cur.found) $(cur.found).textContent = st.total;
  $(cur.grid).innerHTML = st.items.length ? st.items.map(c => `
    <div class="card" tabindex="0" data-id="${c.id}">
      <div class="ph" ${img(c.cover || c.photo)}>${owned.includes(c.id) ? '<span class="mark">owned</span>' : wish.includes(c.id) ? '<span class="mark">wish</span>' : ''}</div>
      <p><b>${esc(c.brand)}</b>${esc(c.name)}<br>${esc(c.volume)} ml · ${esc(c.year)}</p>
    </div>`).join('') : '<div class="empty">No cans here yet.</div>';
  $(cur.more).hidden = st.items.length >= st.total;
}
function openCan(id) {
  const c = st.items.find(x => x.id === id); if (!c) return;
  const inList = k => get(k).includes(id);
  $('#dbody').innerHTML = `<div class="dlg">
    <div class="ph" ${img(c.photo || c.cover)}></div>
    <div>
      <h2 style="margin:0">${esc(c.brand)}</h2><div>${esc(c.name)}</div>
      <dl>
        <dt>Country</dt><dd>${esc(c.country)}</dd>
        <dt>Volume</dt><dd>${esc(c.volume)} ml</dd>
        <dt>Year</dt><dd>${esc(c.year)}</dd>
        <dt>Shape</dt><dd>${esc(SHAPE[c.shape] || '—')}</dd>
        ${c.author ? `<dt>Published by</dt><dd>${esc(c.author)}</dd>` : ''}
      </dl>
      <p>${esc(c.description)}</p>
      <div class="row">
        <button data-k="owned" class="${inList('owned') ? 'on' : ''}">${inList('owned') ? 'In my collection' : 'Add to collection'}</button>
        <button data-k="wish" class="${inList('wish') ? 'on' : ''}">${inList('wish') ? 'In wishlist' : 'Add to wishlist'}</button>
      </div>
    </div></div>`;
  $('#dbody').onclick = e => {
    const k = e.target.dataset.k; if (!k) return;
    const l = get(k), i = l.indexOf(id);
    i < 0 ? l.push(id) : l.splice(i, 1);
    put(k, l); counters(); render(); openCan(id);
  };
  if (!$('#dlg').open) $('#dlg').showModal();
}

// ---------- страницы ----------
const show = id => ['home', 'brandPage', 'seriesPage'].forEach(s => $('#' + s).hidden = s !== id);
function filterParams() {
  const p = new URLSearchParams();
  for (const k of ['q', 'brand', 'country', 'volume', 'year', 'shape']) { const v = $('#' + k).value.trim(); if (v) p.set(k, v); }
  return p;
}
function showHome() {
  show('home');
  const p = filterParams(), searching = p.toString() !== '';
  $('#folders').hidden = searching; $('#results').hidden = !searching;
  if (searching) loadList(p, {grid: '#grid', more: '#more', found: '#found'}, false);
}
async function showBrand(brand) {
  show('brandPage'); $('#bTitle').textContent = brand; $('#sFolders').innerHTML = '';
  try {
    const d = await api('/api/series?brand=' + encodeURIComponent(brand));
    $('#sFolders').innerHTML = d.items.length
      ? byName(d.items).map(seriesTile).join('')
      : '<div class="empty">This brand has no flavor/series folders yet. Create the first one with the folder button.</div>';
  } catch (e) { $('#sFolders').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function showSeries(id) {
  show('seriesPage'); $('#sTitle').textContent = ''; $('#sgrid').innerHTML = '';
  try {
    const s = await api('/api/series?id=' + id);
    $('#sTitle').textContent = s.brand + ' / ' + s.name;
    $('#sBack').href = '#b/' + encodeURIComponent(s.brand);
    loadList(new URLSearchParams({series_id: id}), {grid: '#sgrid', more: '#smore'}, false);
  } catch (e) { $('#sgrid').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
function route() {
  const [t, v] = location.hash.slice(1).split('/');
  if (t === 'b' && v) showBrand(decodeURIComponent(v));
  else if (t === 's' && v) showSeries(+v);
  else showHome();
  window.scrollTo(0, 0);
}

// ---------- вход и регистрация ----------
function updateAuth() {
  $('#who').textContent = me ? 'You: ' + me : '';
  $('#authBtn').textContent = me ? 'Log out' : 'Log in / Sign up';
}
function setMode(m) {
  mode = m;
  $('#tLogin').classList.toggle('on', m === 'login'); $('#tReg').classList.toggle('on', m === 'register');
  $('#aSubmit').textContent = m === 'login' ? 'Log in' : 'Sign up';
  $('#aPass').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  $('#aErr').textContent = '';
}
function needAuth(action) { if (me) return action(); afterAuth = action; setMode('register'); $('#authDlg').showModal(); }
$('#authBtn').onclick = async () => {
  if (me) { try { await api('/api/logout', {method: 'POST'}); } catch {} me = null; updateAuth(); }
  else { afterAuth = null; setMode('login'); $('#authDlg').showModal(); }
};
$('#tLogin').onclick = () => setMode('login');
$('#tReg').onclick = () => setMode('register');
$('#authForm').onsubmit = async e => {
  e.preventDefault(); $('#aErr').textContent = '';
  try {
    const r = await api('/api/' + mode, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({nick: $('#aNick').value.trim(), password: $('#aPass').value})});
    me = r.nick; updateAuth(); $('#authForm').reset(); $('#authDlg').close();
    const a = afterAuth; afterAuth = null; if (a) a();
  } catch (err) { $('#aErr').textContent = err.message; }
};
$('#authDlg').addEventListener('close', () => { afterAuth = null; });

// ---------- создание папки вкуса/серии ----------
$('#serBtn').onclick = () => needAuth(() => { $('#sErr').textContent = ''; $('#serDlg').showModal(); });
$('#serForm').onsubmit = async e => {
  e.preventDefault(); $('#sErr').textContent = '';
  try {
    await api('/api/series', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({brand: $('#sBrand').value, name: $('#sName').value})});
    const b = $('#sBrand').value; $('#serForm').reset(); $('#serDlg').close();
    if (location.hash === '#b/' + encodeURIComponent(b)) route(); else location.hash = 'b/' + encodeURIComponent(b);
  } catch (err) { $('#sErr').textContent = err.message; }
};

// ---------- публикация ----------
$('#pubBtn').onclick = () => needAuth(() => { $('#pErr').textContent = ''; $('#pSerWrap').hidden = true; $('#pubDlg').showModal(); });
$('#pBrand').onchange = async () => {
  const b = $('#pBrand').value; $('#pSerWrap').hidden = !b; if (!b) return;
  try {
    const d = await api('/api/series?brand=' + encodeURIComponent(b));
    $('#pSeries').innerHTML = byName(d.items).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
    $('#pHint').textContent = d.items.length ? '' : 'This brand has no folders yet. Create one first with the folder button.';
  } catch (e) { $('#pHint').textContent = e.message; }
};
$('#pubForm').onsubmit = async e => {
  e.preventDefault();
  const btn = $('#pSubmit'); btn.disabled = true; $('#pErr').textContent = 'Uploading…';
  const fd = new FormData($('#pubForm')), sid = fd.get('series_id');
  try {
    await api('/api/cans', {method: 'POST', body: fd});
    $('#pubForm').reset(); $('#pSerWrap').hidden = true; $('#pubDlg').close();
    await loadMeta();
    if (location.hash === '#s/' + sid) route(); else location.hash = 's/' + sid;
  } catch (err) { $('#pErr').textContent = err.message; }
  btn.disabled = false;
};

// ---------- события ----------
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
const clickFolder = e => {
  const f = e.target.closest('.tile'); if (!f) return;
  location.hash = f.dataset.b ? 'b/' + encodeURIComponent(f.dataset.b) : 's/' + f.dataset.s;
};
for (const id of ['#folders', '#sFolders']) {
  $(id).addEventListener('click', clickFolder);
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') clickFolder(e); });
}
const clickCard = e => { const c = e.target.closest('.card'); if (c) openCan(+c.dataset.id); };
for (const id of ['#grid', '#sgrid']) {
  $(id).addEventListener('click', clickCard);
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') clickCard(e); });
}
document.querySelectorAll('.more').forEach(b => b.onclick = () => loadList(cur.base, cur, true));
$('#back').onclick = () => { $('#f').reset(); showHome(); };
let t; $('#f').addEventListener('input', () => { clearTimeout(t); t = setTimeout(showHome, 250); });
addEventListener('hashchange', route);

const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme() { $('#themeBtn').innerHTML = isDark() ? SUN : MOON; $('#themeBtn').title = isDark() ? 'Switch to light theme' : 'Switch to dark theme'; }
$('#themeBtn').onclick = () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t); } catch {} applyTheme(); };
